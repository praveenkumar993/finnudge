services:
  - type: web
    name: finnudge-backend
    runtime: python
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: finnudge-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1